				inset: 0;
				background: black;

				z-index: -1;

				position: relative;

			.progress-fill {

			window.addEventListener('load', () => {
				document.querySelectorAll('.article-card').forEach(el => {
					el.classList.add('article-card-ready');
				});
			});

			const container = document.getElementById('lessons');
			let activeAudio = null, activeBtn = null, activeFill = null, activeTimeEl = null, rafId = null;

			function fmt(s) {
				if (isNaN(s) || !isFinite(s)) return '0:00';
				const m = Math.floor(s / 60), sec = Math.floor(s % 60);
				return `${m}:${sec.toString().padStart(2, '0')}`;
			}

			function stopAll() {
				if (activeAudio) { activeAudio.pause(); activeAudio.currentTime = 0; }
				if (activeBtn) { activeBtn.classList.remove('playing'); activeBtn.innerHTML = '<i class="fas fa-play"></i>'; }
				if (activeFill) activeFill.style.width = '0%';
				if (activeTimeEl) activeTimeEl.textContent = '0:00';
				cancelAnimationFrame(rafId);
				activeAudio = activeBtn = activeFill = activeTimeEl = null;
			}

			function tick(audio, fill, timeEl) {
				if (!audio.paused) {
					fill.style.width = (audio.duration ? (audio.currentTime / audio.duration) * 100 : 0) + '%';
					timeEl.textContent = fmt(audio.currentTime);
					rafId = requestAnimationFrame(() => tick(audio, fill, timeEl));
				}
			}

			function addPdfCard(href, title) {
				const card = document.createElement('div');
				card.className = 'pdf-card';
				card.innerHTML = `<a href="${href}" target="_blank"><span class="pdf-icon"><i class="fas fa-file-pdf"></i></span><div><div class="pdf-title">${title}</div><div class="pdf-cta">Open PDF →</div></div></a>`;
				container.appendChild(card);
			}

			function addStrategyCard() {
				const card = document.createElement('div');
				card.className = 'strategy-card';
				card.innerHTML = `
					<div class="strategy-title"><span class="strategy-badge">Strategy</span> Assimil Method</div>
					<ol class="strategy-steps">
						<li><span class="step-num">1</span> Blind shadow audio ×2</li>
						<li><span class="step-num">2</span> Shadow audio while looking at native language ×2</li>
						<li><span class="step-num">3</span> Shadow audio while looking at target language ×3</li>
						<li><span class="step-num">4</span> Read target language text</li>
						<li><span class="step-num">5</span> Recall target language while looking at native language, without fail ×2</li>
						<li><span class="step-num">6</span> Blind listen</li>
						<li><span class="step-num">7</span> Go through notes</li>
						<li><span class="step-num">8</span> Go through exercises</li>
						<li><span class="step-num">9</span> Blind listen</li>
					</ol>`;
				container.appendChild(card);
			}

			function addMissingCard(text) {
				const card = document.createElement('div');
				card.className = 'missing-card';
				card.textContent = text;
				container.appendChild(card);
			}

			function addLessonCard(label, title, src) {
				const card = document.createElement('div');
				card.className = 'lesson-card';
				card.innerHTML = `
					<div class="lesson-header">
						<span class="lesson-number">${label}</span>
						<span class="lesson-title">${title}</span>
					</div>
					<div class="player">
						<div class="play-btn-wrap">
							<button class="play-toggle" aria-label="Play ${title}"><i class="fas fa-play"></i></button>
						</div>
						<div class="progress-area">
							<div class="progress-track"><div class="progress-fill"></div></div>
							<div class="time-row"><span class="current-time">0:00</span><span class="duration">--:--</span></div>
						</div>
						<button class="volume-btn" aria-label="Mute"><i class="fas fa-volume-up"></i></button>
					</div>`;

				const btn = card.querySelector('.play-toggle');
				const fill = card.querySelector('.progress-fill');
				const track = card.querySelector('.progress-track');
				const curEl = card.querySelector('.current-time');
				const durEl = card.querySelector('.duration');
				const volBtn = card.querySelector('.volume-btn');
				let audio = null, muted = false;

				function getAudio() {
					if (audio) return audio;
					audio = new Audio(src);
					audio.addEventListener('loadedmetadata', () => { durEl.textContent = fmt(audio.duration); });
					audio.addEventListener('ended', () => {
						btn.classList.remove('playing'); btn.innerHTML = '<i class="fas fa-play"></i>';
						fill.style.width = '0%'; curEl.textContent = '0:00'; cancelAnimationFrame(rafId);
					});
					return audio;
				}

				btn.addEventListener('click', () => {
					const a = getAudio();
					if (!a.paused) {
						a.pause(); btn.classList.remove('playing'); btn.innerHTML = '<i class="fas fa-play"></i>'; cancelAnimationFrame(rafId);
					} else {
						if (activeAudio && activeAudio !== a) stopAll();
						a.play(); btn.classList.add('playing'); btn.innerHTML = '<i class="fas fa-pause"></i>';
						activeAudio = a; activeBtn = btn; activeFill = fill; activeTimeEl = curEl;
						rafId = requestAnimationFrame(() => tick(a, fill, curEl));
					}
				});

				track.addEventListener('click', (e) => {
					const a = getAudio();
					if (!a.duration) return;
					const rect = track.getBoundingClientRect();
					a.currentTime = ((e.clientX - rect.left) / rect.width) * a.duration;
					fill.style.width = (a.currentTime / a.duration * 100) + '%';
					curEl.textContent = fmt(a.currentTime);
				});

				volBtn.addEventListener('click', () => {
					const a = getAudio(); muted = !muted; a.muted = muted;
					volBtn.innerHTML = muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
				});

				container.appendChild(card);
			}
